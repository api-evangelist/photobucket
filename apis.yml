name: Photobucket
description: 'Photobucket is a consumer image and video hosting service founded in 2003 and
  now operated by Photobucket Inc. of Seattle. It provides cloud photo/video storage, organization,
  and private group sharing through subscription plans (My Bucket and +Group Buckets, each
  including 1TB of storage) alongside a free tier. Historically one of the largest image-hosting
  platforms on the early social web, Photobucket opened a public developer API in 2008, but no
  current public/documented API surface could be found during enrichment: the developer portal is
  bot-blocked, the GitHub organization holds only forks and hiring challenges (no official SDK), and
  the app runs as a single-page application with no published /.well-known/ discovery documents.
  Added to the API Evangelist network as a portfolio company of Trinity Ventures.'
